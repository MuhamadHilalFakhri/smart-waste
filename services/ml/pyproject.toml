[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-waste-ml"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.135.1", "uvicorn[standard]==0.41.0", "pydantic-settings==2.13.1",
  "python-multipart==0.0.22", "Pillow==12.1.1", "numpy==2.2.6"
]

[project.optional-dependencies]
model = ["tensorflow-cpu==2.20.0", "keras==3.12.0"]
test = ["pytest==9.0.2", "httpx==0.28.1", "ruff==0.15.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
