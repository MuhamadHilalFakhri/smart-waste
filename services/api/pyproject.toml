[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-waste-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.135.1", "uvicorn[standard]==0.41.0", "sqlalchemy==2.0.48",
  "psycopg[binary]==3.3.3", "alembic==1.18.4", "pydantic-settings==2.13.1",
  "PyJWT==2.12.1", "argon2-cffi==25.1.0", "python-multipart==0.0.22",
  "Pillow==12.1.1", "email-validator==2.3.0"
]

[project.optional-dependencies]
ml = ["tensorflow-cpu==2.20.0", "keras==3.12.0", "numpy==2.2.6"]
test = ["pytest==9.0.2", "httpx==0.28.1", "ruff==0.15.6", "numpy==2.2.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
